<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Weather App</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      color: white;
    }

    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 80%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff7eb3;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ff4f81;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🌤️ Weather App</h1>

    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Check Weather</button>

    <div id="result"></div>
  </div>

  <script>
    function getEmoji(condition) {
      if (condition.includes("cloud")) return "☁️";
      if (condition.includes("rain")) return "🌧️";
      if (condition.includes("clear")) return "☀️";
      if (condition.includes("snow")) return "❄️";
      return "🌍";
    }

    async function getWeather() {
      const city = document.getElementById("city").value;
      const apiKey = "c554b5f842653a91935c3e459d7eb1e9"; // Replace this

      if (!city) {
        document.getElementById("result").innerHTML = "⚠️ Please enter a city name!";
        return;
      }

      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod === 200) {
          const condition = data.weather[0].description.toLowerCase();
          const emoji = getEmoji(condition);

          document.getElementById("result").innerHTML = `
            <h2>${emoji} ${data.name}</h2>
            <p>🌡️ ${data.main.temp}°C</p>
            <p>${condition}</p>
            <p>💧 Humidity: ${data.main.humidity}%</p>
          `;
        } else {
          document.getElementById("result").innerHTML = "❌ City not found!";
        }

      } catch (error) {
        document.getElementById("result").innerHTML = "⚠️ Error fetching data!";
      }
    }
  </script>

</body>
</html>
